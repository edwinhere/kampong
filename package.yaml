name:                kampong
version:             0.1.0.0
github:              "edwinhere/kampong"
license:             BSD-3-Clause
author:              "Edwin"
maintainer:          "edwinhere@gmail.com"
copyright:           "Edwin Jose Palathinkal"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/edwinhere/kampong#readme>

dependencies:
- base >= 4.7 && < 5
- text
- aeson
- conduit
- lens
- containers
- http-types
- http-client
- http-client-tls
- mtl
- transformers
- bytestring
- time
- uuid
- cryptonite
- memory
- base64-bytestring
- network-uri
- wai
- wai-cors
- warp
- sqlite-simple
- protolude

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  exposed-modules:
    - Kampong
    - Kampong.Core
    - Kampong.Core.Activity
    - Kampong.Core.Actor
    - Kampong.Core.Object
    - Kampong.Core.Collection
    - Kampong.Core.WebFinger
    - Kampong.Core.Types
    - Kampong.Core.Actor.Types
    - Kampong.Server
    - Kampong.Storage
    - Kampong.Storage.Memory
    - Kampong.Storage.SQLite
    - Kampong.Storage.Interface
    - Kampong.Storage.Types
    - Kampong.Error
    - Kampong.Logging

executables:
  kampong-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kampong

tests:
  kampong-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - kampong
    - QuickCheck
    - tasty
    - tasty-quickcheck
    - tasty-hunit
    - hspec
